<html lang="en">

    <meta name="description" content="Sacred Hindu Aarti radio with weekday featured deities, devotional temple ambiance, and custom aarti management." />
    <meta property="og:title" content="SoulCity Bhakti Radio" />
    <meta property="og:description" content="Sacred Hindu Aarti radio with weekday featured deities, devotional temple ambiance, and custom aarti management." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          (event.reason.message && event.reason.message.indexOf('WebSocket') !== -1) ||
          (event.reason.toString && event.reason.toString().indexOf('WebSocket') !== -1)
        )) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
